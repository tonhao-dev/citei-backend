name: citei-pact

# Pact Broker local (open source). Guarda os contratos entre o frontend e o backend.
#   npm run pact:broker:up   -> sobe em http://localhost:9292
#   npm run pact:broker:down -> desliga (os dados ficam no volume)
services:
  pact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes:
      - pact_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 3s
      timeout: 3s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
    depends_on:
      pact-db:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-db/pact
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_LOG_LEVEL: INFO
    restart: unless-stopped

volumes:
  pact_pgdata:
